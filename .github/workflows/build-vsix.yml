name: Build VSIX

on:
  push:
    branches:
      - feature/remote-mobile-bridge
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Run protos
        run: npm run protos

      - name: Install webview-ui dependencies
        run: cd webview-ui && npm install --no-audit --no-fund

      - name: Build webview
        run: npm run build:webview

      - name: Bundle extension
        run: node esbuild.mjs --production

      - name: Package VSIX
        run: npx vsce package --allow-package-secrets sendgrid --out cline-remote-bridge.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cline-remote-bridge-vsix
          path: cline-remote-bridge.vsix
          retention-days: 30
