name: Build VSIX

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install webview-ui dependencies
        run: cd webview-ui && npm ci

      - name: Install CLI dependencies
        run: cd cli && npm ci

      - name: Build VSIX
        run: npx vsce package --no-dependencies -o cline.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cline-vsix
          path: cline.vsix
          retention-days: 30
